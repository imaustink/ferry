description=Gateway API controller: Envoy, one proxy pod per Gateway
version=v1.9.1
namespace=envoy-gateway-system
requires=gateway-api
source=https://github.com/envoyproxy/gateway/releases/download/v1.9.1/install.yaml 72b3971364f172eb0b9636c7142cc84ff695467bc065897958bde85a3c06cfd5 envoy-gateway.yaml
server_side=true
# The controller accepting its class is the controller running and reaching the
# API server, which a Ready pod alone does not say.
check=kubectl get gatewayclass eg -o jsonpath='{.status.conditions[?(@.type=="Accepted")].status}' | grep -qx True
