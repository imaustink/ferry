# Upstream's manifest has a token Secret for a headlamp-admin ServiceAccount it
# never creates, so the token is never filled in. This is that account, as
# cluster-admin for the same reason as the dashboard's: one person's cluster.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp-admin
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: headlamp-admin
  namespace: kube-system
