description=certificates from Issuers: self-signed, CA, ACME
version=v1.21.2
namespace=cert-manager
source=https://github.com/cert-manager/cert-manager/releases/download/v1.21.2/cert-manager.yaml e03b668ec8675214af6b0a671699d088f2601fa3878e0dbe1b41d3feafd1879f
server_side=true
# Ready pods are not enough: every Issuer and Certificate is admitted through
# the webhook, which the API server has to reach and which serves a certificate
# the cainjector has to have written into its configuration first. A server-side
# dry run of an Issuer goes through all of that and creates nothing.
check=printf 'apiVersion: cert-manager.io/v1\nkind: ClusterIssuer\nmetadata: {name: ferry-probe}\nspec: {selfSigned: {}}\n' | kubectl apply --dry-run=server -f -
