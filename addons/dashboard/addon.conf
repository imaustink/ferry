description=Kubernetes Dashboard, with a cluster-admin login token
version=v2.7.0
namespace=kubernetes-dashboard
# The last release with a plain manifest -- 7.x is a Helm chart of five pods
# behind Kong -- and the one minikube still ships. The project was retired in
# 2026; headlamp is its successor and is an addon here too.
source=https://raw.githubusercontent.com/kubernetes/dashboard/v2.7.0/aio/deploy/recommended.yaml 943ae40251f1ba64ef012c53271bf6766d1883dd024093e854567b56443764b8 dashboard.yaml
check=kubectl -n kubernetes-dashboard get secret admin-user -o jsonpath='{.data.token}' | grep -q .
