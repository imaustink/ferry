description=Ingress controller, nginx; on the Mac's ports 80 and 443
version=v1.15.1
namespace=ingress-nginx
# Upstream's cloud manifest: its controller Service is a LoadBalancer, which
# ferry-proxy serves on the Mac. v1.15.1 is the last release -- the project was
# retired in March 2026 -- and carries the fix for CVE-2025-1974, which the
# v1.11.3 this replaced did not.
source=https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.15.1/deploy/static/provider/cloud/deploy.yaml 502fddca66b09c20dd48b6d0a792a9671cd663a3a0d2a8bda5ae990d13b6c5b2 ingress-nginx.yaml
# An Ingress is validated through the admission webhook, so one cannot be
# created until the webhook's Service has somewhere to send it.
check=kubectl -n ingress-nginx get endpointslices -l kubernetes.io/service-name=ingress-nginx-controller-admission -o jsonpath='{.items[*].endpoints[?(@.conditions.ready==true)].addresses[0]}' | grep -q .
