apiVersion: v1
kind: Namespace
metadata:
  name: registry
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry
  namespace: registry
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: registry
  labels:
    app: registry
spec:
  replicas: 1
  # One writer on a ReadWriteOnce volume: the old pod goes before the new one
  # starts, or the new one waits for a volume that is still held.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
    spec:
      # On the Mac. localhost:5001 is ferry-proxy forwarding the Mac's own
      # port to a pod on the Mac; on a machine the hostPort would be that
      # machine's, which nothing on the Mac asks. Named as a RuntimeClass so it
      # stays here whatever the cluster's default runtime is.
      runtimeClassName: ferry-vm
      containers:
      - name: registry
        image: registry:3.1.1
        env:
        - name: REGISTRY_STORAGE_DELETE_ENABLED
          value: "true"
        - name: OTEL_TRACES_EXPORTER
          value: none
        # Listening on the hostPort itself. The image's default config puts its
        # debug server on :5001, and a hostPort of 5001 in front of a registry
        # on 5000 was measured reaching the debug server instead: the request
        # arrives at the pod on the hostPort, not rewritten to containerPort.
        - name: REGISTRY_HTTP_ADDR
          value: ":5001"
        - name: REGISTRY_HTTP_DEBUG_ADDR
          value: "127.0.0.1:5002"
        ports:
        # A hostPort rather than a LoadBalancer: ferry-proxy serves it on every
        # address the Mac has, loopback included, so localhost:5001 is this
        # registry both for a push from the Mac and for a pod's image pull --
        # which ferry-cri makes on the Mac, where localhost is the Mac too.
        #
        # 5001, not 5000, for the reason kind's registry uses it: macOS's
        # AirPlay Receiver holds *:5000, and a request there is answered 403
        # by "AirTunes" rather than refused, which looks like a registry fault.
        - containerPort: 5001
          hostPort: 5001
          name: registry
        readinessProbe:
          httpGet:
            path: /v2/
            port: 5001
        volumeMounts:
        - name: data
          mountPath: /var/lib/registry
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: registry
---
# For clients inside the cluster: registry.registry.svc:5000.
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: registry
spec:
  selector:
    app: registry
  ports:
  - name: registry
    port: 5000
    targetPort: 5001
