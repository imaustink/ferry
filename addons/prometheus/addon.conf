description=one Prometheus scraping the API server, kubelet and annotated pods
version=v3.14.0
namespace=monitoring
# Asked of the target list rather than of a query: the data outlives the pod on
# its volume, so a query can answer from a scrape made before a restart.
check=kubectl -n monitoring exec deploy/prometheus -- wget -qO- 'http://localhost:9090/api/v1/targets?state=active&scrapePool=kubelet' | grep -q '"health":"up"'
