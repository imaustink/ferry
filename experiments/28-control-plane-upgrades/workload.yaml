# What the live minor upgrade carries through: a Deployment behind a Service
# with a PodDisruptionBudget, a Secret, a CRD and one of its objects, a Lease,
# and a client pod that reaches both the Service and the API server's own
# Service every 200ms and logs every failure with a timestamp.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: widgets.example.dev
spec:
  group: example.dev
  names: {kind: Widget, plural: widgets, singular: widget}
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              size: {type: integer}
---
apiVersion: v1
kind: Secret
metadata: {name: upgrade-secret}
stringData: {token: kept-across-the-upgrade}
---
apiVersion: coordination.k8s.io/v1
kind: Lease
metadata: {name: upgrade-lease}
spec: {holderIdentity: experiment-28, leaseDurationSeconds: 3600}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web}
spec:
  replicas: 2
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      containers:
      - name: web
        image: nginx:alpine
        ports: [{containerPort: 80}]
---
apiVersion: v1
kind: Service
metadata: {name: web}
spec:
  selector: {app: web}
  ports: [{port: 80}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: web}
spec:
  minAvailable: 1
  selector: {matchLabels: {app: web}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: client}
spec:
  replicas: 1
  selector: {matchLabels: {app: client}}
  template:
    metadata: {labels: {app: client}}
    spec:
      containers:
      - name: client
        image: busybox:1.36
        command: ["/bin/sh", "-c"]
        args:
        - |
          n=0
          while true; do
            n=$((n + 1))
            wget -q -T 2 -O /dev/null http://web/ || echo "$(date +%T) web failed ($n)"
            # 401 is an answer: TLS and the API server are there. Anything else
            # -- refused, reset, timed out -- is not.
            out="$(wget -q -T 2 --no-check-certificate -O /dev/null https://kubernetes.default/readyz 2>&1)"
            case "$out" in *401*|*403*|"") : ;; *) echo "$(date +%T) api failed ($n): $out" ;; esac
            [ $((n % 300)) = 0 ] && echo "$(date +%T) $n rounds"
            sleep 0.2
          done
