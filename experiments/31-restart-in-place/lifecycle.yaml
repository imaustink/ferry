# Init containers, a native sidecar and a regular container, in the order the
# kubelet starts them. `setup` runs the same image as the app, `fetch` another;
# the sidecar keeps running through everything that comes after it.
apiVersion: v1
kind: Pod
metadata:
  name: lifecycle
spec:
  terminationGracePeriodSeconds: 5
  volumes:
  - name: shared
    emptyDir: {}
  initContainers:
  - name: setup
    image: busybox:1.36
    command: ["sh", "-c", "echo setup > /shared/setup; date +%s > /shared/setup-at"]
    volumeMounts: [{name: shared, mountPath: /shared}]
  - name: fetch
    image: alpine:3.20
    command: ["sh", "-c", "cat /etc/alpine-release > /shared/fetched"]
    volumeMounts: [{name: shared, mountPath: /shared}]
  - name: sidecar
    image: busybox:1.36
    restartPolicy: Always
    command: ["sh", "-c", "date +%s > /shared/sidecar-born; exec httpd -f -p 8080 -h /shared"]
    volumeMounts: [{name: shared, mountPath: /shared}]
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh", "-c", "trap 'echo got TERM; exit 0' TERM; cat /shared/setup /shared/fetched; wget -qO- http://127.0.0.1:8080/setup; while true; do sleep 1; done"]
    volumeMounts: [{name: shared, mountPath: /shared}]
