# Writes 64 MiB to its own root and crashes, over and over. Each attempt is a
# new upper directory on the pod's scratch disk; the question is whether the
# dead ones are ever given back.
apiVersion: v1
kind: Pod
metadata:
  name: litter
spec:
  containers:
  - name: litter
    image: busybox:1.36
    command: ["sh", "-c", "dd if=/dev/urandom of=/junk bs=1M count=64 2>/dev/null; sync; sleep 1; exit 1"]
  - name: keep
    image: busybox:1.36
    command: ["sleep", "36000"]
