# A sibling that must survive, and a container that crashes five seconds in.
apiVersion: v1
kind: Pod
metadata:
  name: crash2
spec:
  containers:
  - name: steady
    image: busybox:1.36
    command: ["sh", "-c", "date +%s > /tmp/born; echo started $(date +%s); exec sleep 36000"]
  - name: crasher
    image: busybox:1.36
    command: ["sh", "-c", "echo up $(date +%s); echo scribble > /scribble; ls /; sleep 5; exit 1"]
