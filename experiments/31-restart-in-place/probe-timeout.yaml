# An exec probe that outlives its timeout counts as a failure, and a
# readiness probe that succeeds makes the pod ready.
apiVersion: v1
kind: Pod
metadata:
  name: probe-timeout
spec:
  terminationGracePeriodSeconds: 2
  containers:
  - name: slow
    image: busybox:1.36
    command: ["sleep", "36000"]
    readinessProbe:
      exec: {command: ["true"]}
      periodSeconds: 2
    livenessProbe:
      exec: {command: ["sleep", "5"]}
      timeoutSeconds: 1
      periodSeconds: 3
      failureThreshold: 2
