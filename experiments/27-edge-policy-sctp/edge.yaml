# A web server behind a NodePort and a LoadBalancer on port 80, with probes on
# a port of their own, so policy on the serving port can be told apart from
# policy on the probe port.
apiVersion: v1
kind: Pod
metadata:
  name: web
  labels: {app: web}
spec:
  nodeName: NODE
  containers:
    - name: nginx
      image: nginx:alpine
      command: ["sh", "-c"]
      args:
        - |
          dd if=/dev/zero of=/usr/share/nginx/html/big bs=1M count=256 2>/dev/null
          cat > /etc/nginx/conf.d/health.conf <<EOF
          server { listen 8081; location / { return 200 "ok\n"; } }
          EOF
          exec nginx -g 'daemon off;'
      ports:
        - {name: http, containerPort: 80}
        - {name: health, containerPort: 8081}
      readinessProbe:
        httpGet: {path: /, port: health}
        periodSeconds: 2
      livenessProbe:
        tcpSocket: {port: health}
        initialDelaySeconds: 15 # the dd above, on a busy Mac
        periodSeconds: 3
        failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  type: LoadBalancer
  selector: {app: web}
  ports: [{name: http, port: 80, targetPort: http}]
