# A web server on the second node, behind a NodePort, so the edge's handling of
# an endpoint that is not on the node ferry-proxy runs for can be seen.
apiVersion: v1
kind: Pod
metadata:
  name: web2
  labels: {app: web2}
spec:
  nodeName: n2
  containers:
    - name: nginx
      image: nginx:alpine
      ports: [{name: http, containerPort: 80}]
      readinessProbe:
        httpGet: {path: /, port: http}
        periodSeconds: 2
      livenessProbe:
        tcpSocket: {port: http}
        initialDelaySeconds: 10
        periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: web2
spec:
  type: NodePort
  selector: {app: web2}
  ports: [{name: http, port: 80, targetPort: http}]
