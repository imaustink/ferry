<!doctype html>
<html>
<head><meta charset="utf-8"><title>ferry logo preview</title>
<style>
  body{margin:0;font-family:'SF Pro Text',Helvetica,Arial,sans-serif;background:#f5f6f8;color:#1b2430}
  .wrap{max-width:1040px;margin:0 auto;padding:40px}
  h1{font-weight:700;letter-spacing:-1px}
  .row{display:flex;gap:32px;align-items:center;flex-wrap:wrap;margin:24px 0;padding:24px;background:#fff;border-radius:20px;box-shadow:0 1px 4px #0001}
  .dark{background:#10151d;color:#fff}
  .sizes{display:flex;gap:24px;align-items:flex-end}
  .cap{font-size:13px;color:#8a97a8;margin-top:8px}
  img{display:block}
</style></head>
<body><div class="wrap">
  <h1>ferry — logo</h1>

  <div class="row">
    <img src="ferry-logo.svg" width="640" alt="horizontal lockup">
  </div>

  <div class="row sizes">
    <div><img src="ferry-icon.svg" width="256" alt="icon 256"><div class="cap">256</div></div>
    <div><img src="ferry-icon.svg" width="128" alt="icon 128"><div class="cap">128</div></div>
    <div><img src="ferry-icon.svg" width="64" alt="icon 64"><div class="cap">64</div></div>
    <div><img src="ferry-icon.svg" width="32" alt="icon 32"><div class="cap">32</div></div>
  </div>

  <div class="row dark">
    <div style="color:#326CE5"><img src="ferry-icon-mono.svg" width="140" alt="mono blue"></div>
    <div style="color:#1b2430"><img src="ferry-icon-mono.svg" width="140" alt="mono dark"></div>
    <div style="color:#0b6b4f"><img src="ferry-icon-mono.svg" width="140" alt="mono green"></div>
    <div class="cap" style="align-self:center">monochrome (currentColor)</div>
  </div>
</div></body></html>
