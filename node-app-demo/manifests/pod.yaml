# A basic Linux pod running the app built by ../build.sh. Any ordinary
# container image works here -- this one just happens to have been built
# without Docker.
apiVersion: v1
kind: Pod
metadata:
  name: node-app-demo
  labels: {app: node-app-demo}
spec:
  restartPolicy: Never
  containers:
    - name: app
      image: node-app-demo:1
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 8080
