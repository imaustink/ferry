# A machine: one virtual machine that is a Kubernetes node.
#
# Declared rather than started. The resources are part of the declaration and
# cannot be changed afterwards -- Virtualization.framework fixes a VM's memory
# ceiling when it boots and has no runtime equivalent for CPU at all, so a
# machine of the wrong size is replaced rather than resized. See
# docs/MACHINES.md and experiments/14-balloon.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: machines.ferry.dev
spec:
  group: ferry.dev
  scope: Cluster
  names:
    kind: Machine
    plural: machines
    singular: machine
    shortNames: [ma]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - {name: Phase, type: string, jsonPath: .status.phase}
        - {name: Address, type: string, jsonPath: .status.address}
        - {name: Node, type: string, jsonPath: .status.nodeRef.name}
        - {name: CPUs, type: integer, jsonPath: .spec.cpus, priority: 1}
        - {name: Memory, type: string, jsonPath: .spec.memory, priority: 1}
        - {name: Durability, type: string, jsonPath: .spec.durability, priority: 1}
        - {name: Age, type: date, jsonPath: .metadata.creationTimestamp}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              # A machine's resources are fixed when it boots:
              # Virtualization.framework sets a VM's memory ceiling at creation
              # and has no runtime equivalent for CPU at all. A controller that
              # quietly ignored an edit would leave `kubectl get machine` saying
              # one thing while the machine did another, so the API server
              # refuses the edit instead and the answer is to replace the
              # machine -- which is the Cluster API model anyway.
              x-kubernetes-validations:
                - rule: self == oldSelf
                  message: >-
                    a machine's spec is immutable, because a running VM cannot be
                    resized; delete this machine and create one of the size you want
              properties:
                cpus:
                  type: integer
                  minimum: 1
                  default: 2
                memory:
                  type: string
                  description: Quantity, e.g. 2Gi. Fixed for the life of the machine.
                  default: 2Gi
                disk:
                  type: string
                  description: >-
                    Quantity, e.g. 8Gi. Must match the size of the image this
                    machine clones: that filesystem is built without
                    resize_inode and cannot be grown in place, so a disagreeing
                    size is refused rather than ignored. Omit this to take the
                    image's size; to change it, build an image with
                    `ferry-node build --size-gib` and set spec.image.
                image:
                  type: string
                  description: >-
                    Path to a node disk image. A registry reference belongs here
                    eventually; for now the machine boots what is on disk.
                role:
                  type: string
                  enum: [worker, controlPlane]
                  default: worker
                durability:
                  type: string
                  enum: [power-loss, os-crash, process-crash]
                  description: >-
                    What a write this machine's disk has acknowledged
                    survives. power-loss: a full barrier on the Mac's SSD for
                    every flush. os-crash: an fsync(2), which survives the Mac
                    crashing but not the SSD losing power mid-write.
                    process-crash: none, which survives only ferry-node
                    crashing. Omit it to take the cluster's: os-crash for a
                    power-loss cluster, process-crash for a process-crash one
                    -- or machineDurability in ferry's config. Fixed for the
                    life of the machine, like everything else here.
                node:
                  type: object
                  description: >-
                    What the kubelet inside this machine registers its Node
                    with. Applied at registration rather than patched on
                    afterwards, which is the difference between a guarantee and
                    a race: a taint that arrives after the node is schedulable
                    has already let a pod through.
                  properties:
                    taints:
                      type: array
                      description: >-
                        Taints in the kubelet's own --register-with-taints
                        spelling, `key=value:Effect` or `key:Effect`. Set by the
                        provisioner on machines it creates, and rarely by hand:
                        a taint nothing removes is a machine nothing schedules
                        to. A space would end the kernel parameter these travel
                        on, so one is refused here rather than producing a
                        machine that boots with a truncated command line.
                      items:
                        type: string
                        pattern: '^[^ ,]+:(NoSchedule|PreferNoSchedule|NoExecute)$'
            status:
              type: object
              properties:
                phase:
                  type: string
                  description: Pending, Provisioning, Running, Deleting or Failed.
                address:
                  type: string
                nodeRef:
                  type: object
                  properties:
                    name: {type: string}
                message:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type: {type: string}
                      status: {type: string}
                      reason: {type: string}
                      message: {type: string}
                      lastTransitionTime: {type: string}
