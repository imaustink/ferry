# The macOS NodePool: what ferry provisions for a pod that needs Darwin.
#
# A pod lands here by asking for a macOS machine --
# `runtimeClassName: ferry-macos-shared`, which carries
# `nodeSelector: {ferry.dev/mode: shared-macos}` and the toleration for its
# taint -- and Karpenter makes a macOS machine to hold it (experiment 39):
# a clone of ferry-machined's golden image, its pods macOS processes sharing
# its kernel. Applied only when this Mac has such an image (FERRY_MAC_IMAGE).
#
# Separate from the default pool rather than a second requirement in it,
# because the two do not mix: a macOS machine is tainted, labelled
# shared-macos and runs no Linux image, and a Linux pod must never be the
# reason one is made. ferry-karpenter offers macOS shapes only while one of
# the Mac's two macOS guest slots is free, so a third macOS pod waits in the
# scheduler with a reason rather than making a machine that cannot boot.
#
# The same FerryNodeClass: shapes and the host budget are the Mac's, whichever
# OS a machine runs.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: macos
spec:
  template:
    metadata:
      labels:
        ferry.dev/mode: shared-macos
    spec:
      nodeClassRef:
        group: ferry.dev
        kind: FerryNodeClass
        name: default
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: [arm64]
        - key: kubernetes.io/os
          operator: In
          values: [darwin]
        - key: karpenter.sh/capacity-type
          operator: In
          values: [on-demand]
      # Always tainted, as ferry-machined registers every macOS machine: no pod
      # that names no RuntimeClass can run on XNU.
      taints:
        - {key: ferry.dev/mode, value: shared-macos, effect: NoSchedule}
      expireAfter: 24h
  disruption:
    # A macOS machine holds 4 GiB or more for as long as it lives, and one of
    # two slots: taking an empty one away matters more here than for Linux.
    consolidationPolicy: WhenEmpty
    consolidateAfter: 60s
