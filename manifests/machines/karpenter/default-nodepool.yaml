# The default NodePool: what ferry will provision when pods do not fit.
#
# A pod lands here by asking for a shared kernel --
# `nodeSelector: {ferry.dev/mode: shared}` -- and Karpenter makes a machine
# shaped to hold it. Nothing is declared in advance and nothing is sized by
# hand, which is the whole point: mode 2 without a provisioner means choosing a
# node size before knowing the workload, and that is the bargain ferry exists to
# avoid.
#
# `limits` here is deliberately absent. The ceiling that matters is the Mac's,
# and it belongs to the FerryNodeClass where it applies to every NodePool rather
# than to this one.
apiVersion: ferry.dev/v1alpha1
kind: FerryNodeClass
metadata:
  name: default
spec:
  cpus: {min: 2, max: 8}
  memoryGi: {min: 2, max: 16}
  limits: {cpus: 8, memoryGi: 16}
  maxPods: 110
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    metadata:
      labels:
        ferry.dev/mode: shared
    spec:
      nodeClassRef:
        group: ferry.dev
        kind: FerryNodeClass
        name: default
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: [arm64]
        - key: kubernetes.io/os
          operator: In
          values: [linux]
        - key: karpenter.sh/capacity-type
          operator: In
          values: [on-demand]
      # A machine is cattle, and on a laptop it is cattle with a short life:
      # nothing here is worth keeping across a working day, and memory returned
      # is memory the Mac can use for something else.
      expireAfter: 24h
  disruption:
    # The half without which provisioning is a one-way ratchet, which on a
    # laptop is a memory leak with a controller in front of it.
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 60s
