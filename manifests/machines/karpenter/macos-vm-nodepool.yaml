# The macOS VM NodePool: mode 1, for macOS -- a pod that gets a macOS kernel
# of its own (experiment 39).
#
# A pod lands here with `runtimeClassName: ferry-macos-vm`, which carries
# `nodeSelector: {ferry.dev/mode: macos-vm}` and the toleration for its taint,
# and Karpenter makes a macOS machine for it alone: a ferry-macvm-* shape,
# which holds one pod, so the next pod gets the next machine. The same golden
# image and the same ferry-darwin as the shared macos pool; the difference is
# the kubelet's maxPods, and that the machine goes when its pod does. What
# this buys over ferry-macos-shared is a boundary that is a hypervisor rather
# than a uid and a chroot -- a CI job that wants to be root, load a kext or
# change system settings can -- at the price of a whole guest per pod, and of
# one of the Mac's two macOS guest slots, which both pools share.
#
# Applied only when this Mac has a macOS image (FERRY_MAC_IMAGE).
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: macos-vm
spec:
  template:
    metadata:
      labels:
        ferry.dev/mode: macos-vm
    spec:
      nodeClassRef:
        group: ferry.dev
        kind: FerryNodeClass
        name: default
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: [arm64]
        - key: kubernetes.io/os
          operator: In
          values: [darwin]
        - key: karpenter.sh/capacity-type
          operator: In
          values: [on-demand]
      # Always tainted, as ferry-machined registers every macOS machine: no pod
      # that names no RuntimeClass can run on XNU.
      taints:
        - {key: ferry.dev/mode, value: macos-vm, effect: NoSchedule}
      expireAfter: 24h
  disruption:
    # A pod's VM with no pod is a guest slot held for nothing: it goes as
    # soon as Karpenter sees it empty.
    consolidationPolicy: WhenEmpty
    consolidateAfter: 10s
