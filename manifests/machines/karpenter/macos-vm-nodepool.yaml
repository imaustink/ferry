# The macOS VM NodePool: a pod that gets a macOS kernel of its own
# (experiment 39). This is the only macOS NodePool -- macOS is VM-per-pod.
#
# A pod lands here with `runtimeClassName: ferry-macos-vm`, which carries
# `nodeSelector: {ferry.dev/mode: macos-vm}` and the toleration for its taint,
# and Karpenter makes a macOS machine for it alone: a ferry-macvm-* shape,
# which holds one pod, so the next pod gets the next machine. Its boundary is a
# hypervisor -- a CI job that wants to be root, load a kext or change system
# settings can -- at the price of a whole guest per pod, and of one of the Mac's
# two macOS guest slots (Apple's licence caps a Mac at two macOS VMs).
#
# Applied only when this Mac has a macOS golden image (found automatically once baked).
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: macos-vm
spec:
  template:
    metadata:
      labels:
        ferry.dev/mode: macos-vm
    spec:
      nodeClassRef:
        group: ferry.dev
        kind: FerryNodeClass
        name: default
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: [arm64]
        - key: kubernetes.io/os
          operator: In
          values: [darwin]
        - key: karpenter.sh/capacity-type
          operator: In
          values: [on-demand]
      # Always tainted, as ferry-machined registers every macOS machine: no pod
      # that names no RuntimeClass can run on XNU.
      taints:
        - {key: ferry.dev/mode, value: macos-vm, effect: NoSchedule}
      expireAfter: 24h
  disruption:
    # A pod's VM with no pod is a guest slot held for nothing: it goes as
    # soon as Karpenter sees it empty.
    consolidationPolicy: WhenEmpty
    consolidateAfter: 10s
