# Builds and deploys node-app/ the way a real user's CI would: install a
# published ferry release (not a checkout of ferry's own source -- this
# tests the exact path an app team gets), bring up a cluster, and replace
# `docker build` + `docker run`/`kind load` with `ferry image build` and a
# real rollout, gated on the app answering.
#
# This needs a self-hosted runner on a real Apple silicon Mac, macOS 26+
# (docs/INSTALL.md, install.sh's preflight) -- not a GitHub-hosted macos-*
# runner. A pod is a Virtualization.framework VM, and GitHub's hosted macOS
# runners are themselves VMs with nested virtualization disabled ("VMs
# within VMs are not supported", GitHub's runner-images docs); `ferry up`
# cannot create one inside another it doesn't own. `vars.FERRY_CI_RUNNER`
# names whatever self-hosted label this repo registers (see
# https://docs.github.com/actions/hosting-your-own-runners), so this file
# does not have to change when that label does.
name: node-app

on:
  push:
    branches: [main]
    paths: ["node-app/**", ".github/workflows/node-app.yml"]
  pull_request:
    paths: ["node-app/**", ".github/workflows/node-app.yml"]

concurrency:
  group: node-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ${{ fromJSON(vars.FERRY_CI_RUNNER || '["self-hosted", "macOS", "ARM64"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: install buildctl
        run: brew install buildkit

      - name: install ferry
        env:
          FERRY_SKIP_START: "1"   # 'ferry up' is its own step, below, for a clear log boundary
          FERRY_SKIP_SERVICE: "1" # no LaunchAgent on a runner that is gone after this job
        run: curl -sfL https://get.ferry.kurpuis.com | sh -

      - name: ferry doctor
        run: ferry doctor

      - name: ferry up
        run: ferry up

      - name: ferry image build (replaces docker build)
        working-directory: node-app
        run: ./build.sh

      - name: deploy and verify (Deployment, Service, NetworkPolicy, PDB)
        working-directory: node-app
        run: ./run.sh

      - name: cluster state, on failure
        if: failure()
        run: |
          ferry status || true
          kubectl get events --sort-by=.lastTimestamp | tail -50 || true
          kubectl logs -l app=node-app --all-containers --tail=200 || true

      - name: tear down
        if: always()
        working-directory: node-app
        run: |
          kubectl delete -k manifests/ --ignore-not-found || true
          ferry image build --stop || true
          ferry down --purge || true
