name: Bug report
description: Something ferry did that it should not have, or did not do
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: ferry version
      description: The output of `ferry version`.
      render: text
    validations:
      required: true
  - type: textarea
    id: bundle
    attributes:
      label: Logs
      description: |
        Run `ferry logs --bundle` and drag the .tar.gz it writes here. It holds
        component logs and cluster state, not credentials, but look through it
        first. If the cluster would not start at all, `ferry doctor` output
        helps too.
    validations:
      required: false
  - type: input
    id: mac
    attributes:
      label: Mac
      description: Chip, memory and macOS version, e.g. "M3 Pro, 36 GB, macOS 26.6".
